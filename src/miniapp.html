<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bellwether</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Bellwether League: black + light blue, liquid glass. */
  :root {
    color-scheme: dark;
    --page: #04070c; --card: rgb(255 255 255 / .055); --line: rgb(124 200 247 / .16); --soft: rgb(124 200 247 / .10); --soft-2: rgb(124 200 247 / .18);
    --ink: #eaf4ff; --ink-2: #a3b7cb; --ink-3: #6c8399;
    --brand: #7cc8f7; --brand-2: #8fd3ff; --brand-3: #2b8fdc; --on-brand: #03121f;
    --pass: #3ddc97; --pass-bg: rgb(61 220 151 / .13); --fail: #ff6b6b; --fail-bg: rgb(255 107 107 / .13); --wash: #8fa3b8; --wash-bg: rgb(255 255 255 / .06);
    --wolf-a: #6b6ff0; --wolf-b: #4aa8ee;
    --shadow: 0 20px 50px rgb(0 0 0 / .45); --shadow-sm: inset 0 1px 0 rgb(255 255 255 / .08), 0 8px 24px rgb(0 0 0 / .35);
    --hero: linear-gradient(150deg, rgb(124 200 247 / .30) 0%, rgb(43 143 220 / .18) 45%, rgb(255 255 255 / .04) 100%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--page); }
  body::before { content: ""; position: fixed; inset: -20%; z-index: -1; background: radial-gradient(500px 400px at 15% 5%, rgb(74 168 238 / .35), transparent 60%), radial-gradient(420px 380px at 95% 35%, rgb(124 200 247 / .18), transparent 60%), radial-gradient(600px 500px at 40% 110%, rgb(27 95 158 / .35), transparent 60%); filter: blur(10px); }
  html, body { margin: 0; color: var(--ink); font: 600 15px/1.4 Nunito, ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  body { padding-bottom: calc(150px + env(safe-area-inset-bottom)); min-height: 100vh; }
  button { font-family: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  main { padding: 0 14px; }
  h2 { font-size: 18px; font-weight: 900; margin: 18px 4px 10px; letter-spacing: -0.01em; }
  .muted { color: var(--ink-3); } .sub { color: var(--ink-2); font-size: 13px; }
  .card, .lrow, .pod, .stock, .match, .tally div, .kv div, .pad, .live, .search, nav, .player, .sheet { backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); }
  .card, .lrow, .pod, .stock, .match, .tally div, .pad { border: 1px solid var(--line); }
  .card { background: var(--card); border-radius: 22px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }

  /* top bar */
  .top { display: flex; align-items: center; gap: 8px; padding: 12px 16px 6px; }
  .top img { width: 30px; height: 30px; filter: drop-shadow(0 0 10px rgb(74 168 238 / .6)); }
  .top b { font-size: 19px; font-weight: 900; letter-spacing: -0.02em; }
  .live { margin-left: auto; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
  .live.open { color: var(--pass); } .live.closed { color: var(--fail); }

  /* player card */
  .player { margin: 8px 14px 4px; border-radius: 26px; padding: 18px; background: var(--hero); border: 1px solid rgb(124 200 247 / .3); color: #fff; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .player::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; border: 28px solid rgb(255 255 255 / .12); }
  .p-row { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .avatar { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; font-weight: 900; font-size: 17px; flex: none; }
  .player .avatar { background: rgb(255 255 255 / .22) !important; color: #fff !important; width: 54px; height: 54px; border-radius: 18px; font-size: 20px; }
  .p-name { font-size: 20px; font-weight: 900; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chip { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgb(255 255 255 / .2); color: #fff; white-space: nowrap; }
  .p-stats { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; margin-top: 16px; position: relative; z-index: 1; }
  .ring-wrap { position: relative; width: 96px; height: 96px; }
  .ring-wrap .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
  .ring-wrap .c b { font-size: 24px; font-weight: 900; } .ring-wrap .c span { font-size: 11px; opacity: .85; }
  .p-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: rgb(255 255 255 / .16); border-radius: 14px; padding: 8px 6px; text-align: center; }
  .kpi b { display: block; font-size: 20px; font-weight: 900; } .kpi span { font-size: 11px; opacity: .9; }
  .p-note { margin-top: 12px; font-size: 13px; background: rgb(255 255 255 / .16); border-radius: 12px; padding: 8px 10px; position: relative; z-index: 1; }
  .p-bar { height: 7px; border-radius: 4px; background: rgb(255 255 255 / .25); margin-top: 6px; overflow: hidden; } .p-bar i { display: block; height: 100%; background: #fff; border-radius: 4px; }

  /* podium */
  .podium { display: grid; grid-template-columns: 1fr 1.12fr 1fr; gap: 8px; align-items: end; margin: 6px 0 12px; }
  .pod { background: var(--card); border-radius: 20px; padding: 12px 6px 10px; text-align: center; box-shadow: var(--shadow-sm); position: relative; }
  .pod .medal { font-size: 26px; line-height: 1; }
  .pod .avatar { margin: 6px auto 6px; }
  .pod .nm { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pod .pts { font-size: 18px; font-weight: 900; color: var(--brand-2); text-align: center; }
  .pod .pts small { display: inline; font-size: 11px; color: var(--ink-3); font-weight: 700; }
  .pod.first { padding-top: 18px; padding-bottom: 16px; background: linear-gradient(180deg, rgb(255 209 102 / .16) 0%, var(--card) 70%); border-color: rgb(255 209 102 / .3); }
  .pod.me, .lrow.me { outline: 2.5px solid var(--brand); }
  .pod.empty { opacity: .55; }

  /* league rows */
  .lrow { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 18px; padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow-sm); }
  .rank { width: 24px; text-align: center; font-weight: 900; color: var(--ink-3); }
  .grow { flex: 1; min-width: 0; }
  .grow b { display: block; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow > span { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .pts { text-align: right; font-weight: 900; font-size: 16px; } .pts small { display: block; font-size: 11px; color: var(--ink-3); font-weight: 700; }
  .tier { display: inline-block; font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; vertical-align: 1px; }
  .t-WOLF { background: linear-gradient(90deg, var(--wolf-a), var(--wolf-b)); color: #fff; }
  .t-SHARP { background: #4aa8ee; color: var(--on-brand); }
  .t-BASE { background: var(--soft-2); color: var(--brand-2); }
  .t-rookie { background: var(--soft); color: var(--ink-2); }
  .t-warmup { background: var(--pass-bg); color: var(--pass); }
  .t-demo { background: rgb(255 209 102 / .12); color: #ffd98a; }

  /* call button */
  .fab { position: fixed; left: 14px; right: 14px; bottom: calc(78px + env(safe-area-inset-bottom)); z-index: 7; border: 0; border-radius: 20px; padding: 16px;
    background: linear-gradient(135deg, #a5dcff 0%, #7cc8f7 40%, #4aa8ee 100%); color: var(--on-brand); font-size: 17px; font-weight: 900; box-shadow: 0 10px 30px rgb(74 168 238 / .45), inset 0 1px 0 rgb(255 255 255 / .6); }
  .fab:active { transform: scale(.98); }

  /* nav */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: rgb(8 14 22 / .78); border-top: 1px solid var(--line); display: flex; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 20px rgb(26 111 184 / .08); }
  nav button { flex: 1; border: 0; background: transparent; color: var(--ink-3); font-size: 11px; font-weight: 800; padding: 6px 0; border-radius: 14px; }
  nav button i { display: block; font-style: normal; font-size: 21px; line-height: 1.25; }
  nav button.on { color: var(--brand-2); background: var(--soft); }

  /* trade */
  .seg { display: flex; background: var(--soft); border-radius: 16px; padding: 4px; gap: 4px; margin: 10px 0; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--ink-2); padding: 9px 6px; border-radius: 12px; font-size: 13px; font-weight: 800; }
  .seg button.on { background: var(--card); color: var(--brand-2); box-shadow: var(--shadow-sm); }
  .seg button:disabled { opacity: .4; }
  .search { width: 100%; border: 0; background: var(--card); color: var(--ink); border-radius: 16px; padding: 12px 14px; font: inherit; box-shadow: var(--shadow-sm); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .stock { background: var(--card); border-radius: 20px; padding: 12px; box-shadow: var(--shadow-sm); border: 0; text-align: left; color: var(--ink); }
  .stock .tk { font-size: 17px; font-weight: 900; } .stock .nm { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stock .px { font-size: 18px; font-weight: 900; margin-top: 8px; }
  .stock .bands { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .stock .bands span { font-size: 10.5px; font-weight: 800; background: var(--soft); color: var(--brand-2); border-radius: 8px; padding: 2px 6px; }

  /* sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgb(7 22 42 / .4); z-index: 10; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: rgb(8 14 22 / .92); border-top: 1px solid var(--line); border-radius: 28px 28px 0 0; padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .24s cubic-bezier(.2,.8,.2,1); max-height: 92vh; overflow: auto; }
  .sheet.on { transform: none; } .sheet-bg.on { display: block; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .s-head { display: flex; align-items: center; gap: 12px; }
  .s-head .avatar { background: var(--soft); color: var(--brand-2); }
  .pads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .pad { border: 3px solid transparent; border-radius: 22px; padding: 16px 12px; text-align: left; color: var(--ink); background: var(--card); box-shadow: var(--shadow-sm); }
  .pad b { display: block; font-size: 22px; font-weight: 900; }
  .pad span { display: block; font-size: 12px; color: var(--ink-2); }
  .pad.long b { color: var(--pass); } .pad.short b { color: var(--fail); }
  .pad.long.on { border-color: var(--pass); background: var(--pass-bg); } .pad.short.on { border-color: var(--fail); background: var(--fail-bg); }
  .cta { width: 100%; border: 0; background: linear-gradient(135deg, #a5dcff 0%, #7cc8f7 40%, #4aa8ee 100%); color: var(--on-brand); font-weight: 900; font-size: 17px; padding: 16px; border-radius: 18px; box-shadow: 0 10px 24px rgb(43 143 220 / .3); }
  .cta:disabled { opacity: .45; box-shadow: none; }
  .result { text-align: center; padding: 6px 4px 2px; position: relative; }
  .result .big { font-size: 34px; font-weight: 900; letter-spacing: .02em; margin: 4px 0 2px; }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .kv div { background: var(--card); border-radius: 14px; padding: 8px 4px; text-align: center; font-weight: 900; box-shadow: var(--shadow-sm); }
  .kv div span { display: block; font-size: 11px; color: var(--ink-3); font-weight: 700; }

  /* calls / match history */
  .match { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 20px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow-sm); border-left: 6px solid var(--line); }
  .match.PASS { border-left-color: var(--pass); } .match.FAILED { border-left-color: var(--fail); } .match.PENDING { border-left-color: var(--brand); }
  .match .res { font-size: 13px; font-weight: 900; padding: 4px 10px; border-radius: 10px; white-space: nowrap; }
  .r-PASS { background: var(--pass-bg); color: var(--pass); } .r-FAILED { background: var(--fail-bg); color: var(--fail); }
  .r-NO { background: var(--wash-bg); color: var(--wash); } .r-PENDING { background: var(--soft); color: var(--brand-2); }
  .tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 14px; }
  .tally div { background: var(--card); border-radius: 18px; padding: 10px; text-align: center; box-shadow: var(--shadow-sm); }
  .tally b { display: block; font-size: 24px; font-weight: 900; } .tally span { font-size: 12px; color: var(--ink-3); }

  /* me */
  .board { display: flex; align-items: center; gap: 12px; }
  .board .avatar { background: var(--soft); color: var(--brand-2); font-size: 15px; }
  .bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-top: 10px; } .bar i { display: block; height: 100%; background: var(--brand); border-radius: 4px; }

  .empty { text-align: center; color: var(--ink-3); padding: 26px 10px; }
  .intro { position: fixed; inset: 0; z-index: 20; background: radial-gradient(600px 500px at 20% 10%, rgb(74 168 238 / .45), transparent 60%), #04070c; color: #fff; display: none; flex-direction: column; padding: 40px 24px calc(24px + env(safe-area-inset-bottom)); }
  .intro.on { display: flex; }
  .intro .emoji { font-size: 64px; }
  .intro h1 { font-size: 30px; font-weight: 900; margin: 14px 0 8px; letter-spacing: -0.02em; }
  .intro p { font-size: 16px; opacity: .95; }
  .intro .step { flex: 1; }
  .intro .cta { color: var(--on-brand); }
  .dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0; } .dots i { width: 8px; height: 8px; border-radius: 4px; background: rgb(255 255 255 / .4); } .dots i.on { background: #fff; width: 22px; }
  /* stories (Wrapped-style walkthrough) */
  .story { position: fixed; inset: 0; z-index: 40; display: none; color: #fff; background: #04070c; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .story.on { display: block; }
  .story .bg { position: absolute; inset: -20%; transition: background 0.6s ease; }
  .story .bars { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 4px; z-index: 3; }
  .story .bars i { flex: 1; height: 3px; border-radius: 2px; background: rgb(255 255 255 / .25); overflow: hidden; }
  .story .bars i b { display: block; height: 100%; width: 0; background: #fff; border-radius: 2px; }
  .story .head { position: absolute; top: calc(22px + env(safe-area-inset-top)); left: 16px; right: 12px; display: flex; align-items: center; gap: 8px; z-index: 3; font-weight: 800; font-size: 14px; }
  .story .head img { width: 26px; height: 26px; }
  .story .head .x { margin-left: auto; background: rgb(255 255 255 / .12); border: 0; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; }
  .story .tap { position: absolute; top: 70px; bottom: 120px; z-index: 2; } .story .tap.l { left: 0; width: 35%; } .story .tap.r { right: 0; width: 65%; }
  .story .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 90px 26px calc(120px + env(safe-area-inset-bottom)); z-index: 1; }
  .story .kicker { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #a5dcff; }
  .story h1 { font-size: clamp(38px, 11vw, 54px); line-height: 1.02; letter-spacing: -0.03em; font-weight: 900; margin: 10px 0 14px; }
  .story p { font-size: 17px; line-height: 1.45; color: rgb(234 244 255 / .85); margin: 0; max-width: 420px; }
  .story .big { font-size: clamp(84px, 30vw, 140px); font-weight: 900; letter-spacing: -0.05em; line-height: .95; background: linear-gradient(180deg, #fff, #7cc8f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .story .foot { position: absolute; left: 20px; right: 20px; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 4; display: flex; gap: 10px; }
  .story .foot .cta { flex: 1; }
  .story .ghostbtn { flex: 1; border: 1px solid rgb(255 255 255 / .3); background: rgb(255 255 255 / .08); color: #fff; font-weight: 900; font-size: 16px; padding: 16px; border-radius: 18px; }
  .story .hint { position: absolute; bottom: calc(34px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; color: rgb(255 255 255 / .55); z-index: 3; }
  .s-in > * { opacity: 0; transform: translateY(18px); animation: sIn .6s cubic-bezier(.2,.8,.2,1) forwards; }
  .s-in > *:nth-child(2) { animation-delay: .12s; } .s-in > *:nth-child(3) { animation-delay: .24s; } .s-in > *:nth-child(4) { animation-delay: .36s; } .s-in > *:nth-child(5) { animation-delay: .48s; }
  @keyframes sIn { to { opacity: 1; transform: none; } }
  .tick-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 18px; }
  .tick-cloud span { font-weight: 900; font-size: 15px; padding: 7px 12px; border-radius: 12px; background: rgb(255 255 255 / .09); border: 1px solid rgb(124 200 247 / .3); opacity: 0; animation: pop2 .5s forwards; }
  @keyframes pop2 { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  .mock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 18px; }
  .mock div { border-radius: 20px; padding: 18px 14px; font-weight: 900; font-size: 22px; border: 2px solid; }
  .mock .l { color: #3ddc97; border-color: #3ddc97; background: rgb(61 220 151 / .12); animation: pulse 1.6s ease-in-out infinite; }
  .mock .s { color: #ff6b6b; border-color: rgb(255 107 107 / .5); background: rgb(255 107 107 / .08); }
  .mock small { display: block; font-size: 12px; font-weight: 700; color: rgb(234 244 255 / .7); margin-top: 4px; }
  @keyframes pulse { 50% { transform: scale(1.04); box-shadow: 0 0 30px rgb(61 220 151 / .35); } }
  .pf { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 18px; }
  .pf b { font-size: 46px; font-weight: 900; letter-spacing: -0.03em; }
  .lanes { display: grid; gap: 10px; margin: 6px 0 18px; }
  .lanes div { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 10px; font-weight: 900; }
  .lanes i { display: block; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #a5dcff, #4aa8ee); width: 0; animation: grow 1s cubic-bezier(.2,.8,.2,1) forwards; }
  .lanes span { font-size: 13px; color: rgb(234 244 255 / .7); text-align: right; }
  @keyframes grow { to { width: var(--w); } }
  .tiers { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 18px; }
  .tiers div { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 18px; background: rgb(255 255 255 / .07); border: 1px solid rgb(124 200 247 / .25); font-weight: 900; font-size: 18px; }
  .tiers div.w { background: linear-gradient(90deg, rgb(107 111 240 / .5), rgb(74 168 238 / .4)); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .stat-grid div { padding: 14px; border-radius: 18px; background: rgb(255 255 255 / .08); border: 1px solid rgb(124 200 247 / .25); }
  .stat-grid b { display: block; font-size: 30px; font-weight: 900; } .stat-grid span { font-size: 12px; color: rgb(234 244 255 / .7); }
  .wrapped-btn { margin-top: 10px; width: 100%; border: 1px solid rgb(255 255 255 / .3); background: rgb(255 255 255 / .1); color: #fff; font-weight: 900; padding: 10px; border-radius: 14px; position: relative; z-index: 1; }
  .toast { position: fixed; left: 16px; right: 16px; top: 12px; z-index: 30; background: var(--ink); color: var(--card); padding: 12px 14px; border-radius: 14px; font-size: 14px; display: none; }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .confetti i { position: absolute; left: 50%; top: 40px; width: 8px; height: 12px; border-radius: 2px; opacity: 0; animation: pop 1.1s ease-out forwards; }
  @keyframes pop { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } .sheet { transition: none; } }
</style>
</head>
<body>
<div class="top"><img src="/assets/logo.svg" alt=""><b>Bellwether</b><span class="live" id="session">…</span></div>
<div id="view"></div>
<button class="fab" id="fab">📈 Make a call</button>
<nav id="nav">
  <button data-tab="league" class="on"><i>🏆</i>League</button>
  <button data-tab="trade"><i>📈</i>Trade</button>
  <button data-tab="calls"><i>🎯</i>Calls</button>
  <button data-tab="me"><i>👤</i>Me</button>
</nav>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"></div>
<div class="intro" id="intro"></div>
<div class="story" id="story"></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
const initData = tg?.initData || '';
const setTheme = () => { try { tg?.setHeaderColor?.('#04070c'); tg?.setBackgroundColor?.('#04070c'); tg?.setBottomBarColor?.('#04070c'); } catch {} };
if (tg) { tg.ready(); tg.expand(); setTheme(); tg.onEvent?.('themeChanged', setTheme); }
const haptic = (k) => { try { k === 'ok' || k === 'err' ? tg.HapticFeedback.notificationOccurred(k === 'ok' ? 'success' : 'error') : tg.HapticFeedback.selectionChanged(); } catch {} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const px = (x, ref = x) => x == null ? '–' : Number(x).toFixed(Math.min(Math.max(0, 4 - Math.floor(Math.log10(Math.abs(ref || 1)))), 6));
const pct = (bps) => `±${(bps / 100).toFixed(2)}%`;
const pctR = (x) => x == null || isNaN(x) ? '–' : `${Math.round(x * 100)}%`;
const until = (t) => { const m = Math.max(0, Math.round((t - Date.now()) / 60000)); const h = Math.floor(m / 60); return h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : h ? `${h}h ${m % 60}m` : `${m}m`; };
const ny = (t) => new Date(t).toLocaleString('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: '2-digit', minute: '2-digit' });
const initials = (n) => n.replace(/^🤖\s*/, '').replace(/^@/, '').split(/[\s_.-]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';
const TINTS = [['rgb(124 200 247 / .14)', '#8fd3ff'], ['rgb(107 111 240 / .18)', '#b3b6ff'], ['rgb(61 220 151 / .14)', '#7ee8b8'], ['rgb(144 133 233 / .18)', '#c0b8ff'], ['rgb(74 168 238 / .18)', '#7cc8f7']];
const avatar = (r) => {
  if (r.agent) return '<div class="avatar" style="background:var(--soft);font-size:22px">🤖</div>';
  let h = 0; for (const ch of r.name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const [bg, fg] = TINTS[h % TINTS.length];
  return `<div class="avatar" style="background:${bg};color:${fg}">${esc(initials(r.name))}</div>`;
};
const TIER = { WOLF: '🐺 WOLF', SHARP: '🎯 SHARP', BASE: '✅ BASE' };
const tierChip = (tier, warmup) => tier ? `<span class="tier t-${tier}">${TIER[tier]}</span>`
  : warmup ? '<span class="tier t-warmup">🌱 Warmup</span>' : '<span class="tier t-rookie">Rookie</span>';

const q0 = new URLSearchParams(location.search);
let S = null, tab = q0.get('tab') || 'league', group = 'liquid', query = '', pick = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', 'x-telegram-init-data': initData, ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

async function load() {
  try { S = await api('/api/app/state'); }
  catch (e) { $('view').innerHTML = `<main><div class="card empty">${esc(e.message)}<br><br>Open Bellwether from the bot's <b>Open app</b> button.</div></main>`; return; }
  const sess = $('session');
  sess.textContent = S.market.session.open ? '● Market open' : '● Closed';
  sess.className = 'live ' + (S.market.session.open ? 'open' : 'closed');
  if (!S.me.onboarded && !load.introShown) { load.introShown = true; playTour(); }
  render();
}

function countUp(el, to, suffix = '') {
  if (!el) return; if (q0.has('static')) { el.textContent = to + suffix; return; } const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / 1100); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + suffix; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function wrappedSlides() {
  const m = S.me, k = m.club, C = S.calls.filter((c) => c.status !== 'open');
  const pass = C.filter((c) => c.result === 'PASS').length, fail = C.filter((c) => c.result === 'FAILED').length;
  const by = {}; for (const c of C) { by[c.label] ??= { n: 0, p: 0 }; by[c.label].n++; if (c.result === 'PASS') by[c.label].p++; }
  const fav = Object.entries(by).sort((a, b) => b[1].n - a[1].n)[0];
  const best = Object.entries(by).filter(([, v]) => v.p > 0).sort((a, b) => b[1].p - a[1].p)[0];
  const rate = pass + fail ? pass / (pass + fail) : 0;
  const tierTxt = m.tier ? { WOLF: '🐺 WOLF', SHARP: '🎯 SHARP', BASE: '✅ BASE' }[m.tier] : k.warmup.done ? 'Rookie' : '🌱 Warmup';
  return [
    { d: 4500, html: () => `<div class="kicker">Your Bellwether</div><h1>${esc(m.name)},<br>here's your run.</h1><p>Every call, graded by the market.</p>` },
    { d: 5000, html: () => `<div class="kicker">You called</div><div class="big" id="w-calls">0</div><h1 style="margin-top:4px">stocks.</h1><p>${fav ? `Your favorite: <b>${esc(fav[0])}</b>, ${fav[1].n} calls.` : 'Every one sealed until it resolved.'}</p>`, after: () => countUp($('w-calls'), C.length) },
    { d: 5500, html: () => `<div class="kicker">Hit rate</div><div class="big" id="w-rate">0%</div><div class="stat-grid"><div><b style="color:#3ddc97">${pass}</b><span>PASS</span></div><div><b style="color:#ff6b6b">${fail}</b><span>FAILED</span></div></div>`, after: () => countUp($('w-rate'), Math.round(rate * 100), '%') },
    ...(best ? [{ d: 4500, html: () => `<div class="kicker">Your best stock</div><div class="big">${esc(best[0])}</div><p>${best[1].p} PASS${best[1].p === 1 ? '' : 'es'} out of ${best[1].n} calls.</p>` }] : []),
    { d: 5500, html: () => `<div class="kicker">Where you stand</div><h1>${tierTxt}</h1><div class="stat-grid"><div><b>${m.rank ? '#' + m.rank : '–'}</b><span>rank this week</span></div><div><b>${k.streak ? '🔥' + k.streak : '–'}</b><span>day streak</span></div><div><b>${Math.round(k.points7d)}</b><span>points this week</span></div><div><b>${k.wins}/${k.n}</b><span>last 20</span></div></div>` },
    { d: 0, final: true, html: () => `<div class="kicker">Next up</div><h1>${k.n >= k.rolling && k.wins / k.n >= k.minRate ? 'Defend your spot.' : `${Math.max(0, k.need - k.wins)} more PASS to the club.`}</h1><p>Keep calling. The board resets every week.</p>` },
  ];
}

let story = null;
function playStory(slides, onDone) {
  const el = $('story');
  story = { slides, i: 0, t: 0, paused: false, onDone, raf: 0, last: 0 };
  el.innerHTML = `<div class="bg" id="s-bg"></div>
    <div class="bars">${slides.map(() => '<i><b></b></i>').join('')}</div>
    <div class="head"><img src="/assets/logo.svg" alt="">Bellwether<button class="x" id="s-x" aria-label="Close">✕</button></div>
    <div class="slide" id="s-slide"></div>
    <div class="tap l" id="s-l"></div><div class="tap r" id="s-r"></div>
    <div id="s-foot"></div>`;
  el.classList.add('on');
  $('s-x').onclick = () => endStory();
  $('s-l').onclick = () => showSlide(story.i - 1);
  $('s-r').onclick = () => showSlide(story.i + 1);
  const hold = (v) => () => { if (story) story.paused = v; };
  for (const id of ['s-l', 's-r']) { $(id).onpointerdown = hold(true); $(id).onpointerup = hold(false); $(id).onpointerleave = hold(false); }
  showSlide(0);
  story.last = performance.now();
  const tick = (now) => {
    if (!story) return;
    const sl = story.slides[story.i];
    if (!story.paused && sl.d) { story.t += now - story.last; if (story.t >= sl.d) { showSlide(story.i + 1); } }
    story.last = now;
    const bars = el.querySelectorAll('.bars b');
    bars.forEach((b, j) => b.style.width = j < story.i ? '100%' : j > story.i ? '0%' : `${sl.d ? Math.min(100, (story.t / sl.d) * 100) : 100}%`);
    story.raf = requestAnimationFrame(tick);
  };
  story.raf = requestAnimationFrame(tick);
}
function showSlide(i) {
  if (!story) return;
  if (i < 0) i = 0;
  if (i >= story.slides.length) return endStory();
  story.i = i; story.t = 0; haptic();
  const sl = story.slides[i];
  $('s-bg').style.background = SCENES[i % SCENES.length];
  $('s-slide').className = 'slide s-in';
  $('s-slide').innerHTML = sl.html();
  $('s-foot').innerHTML = sl.final
    ? `<div class="foot"><button class="ghostbtn" id="s-league">Explore the League</button><button class="cta" id="s-go">📈 Make a call</button></div>`
    : `<div class="hint">Tap to continue · hold to pause</div>`;
  if (sl.final) { $('s-league').onclick = () => endStory('league'); $('s-go').onclick = () => endStory('trade'); }
  sl.after?.();
}
async function endStory(goto) {
  if (!story) return;
  cancelAnimationFrame(story.raf);
  const done = story.onDone; story = null;
  $('story').classList.remove('on');
  await done?.();
  if (goto) go(goto);
}
const playTour = () => playStory(TOUR, async () => { try { await api('/api/app/onboard', { method: 'POST', body: '{}' }); } catch {} });

// ---------- navigation ----------
function go(t) {
  tab = t; haptic();
  document.querySelectorAll('#nav button').forEach((x) => x.classList.toggle('on', x.dataset.tab === t));
  render(); window.scrollTo(0, 0);
}
document.querySelectorAll('#nav button').forEach((b) => b.onclick = () => go(b.dataset.tab));
document.querySelectorAll('#nav button').forEach((x) => x.classList.toggle('on', x.dataset.tab === tab));
$('fab').onclick = () => go('trade');

function render() {
  if (!S) return;
  $('fab').style.display = tab === 'trade' ? 'none' : 'block';
  document.body.style.paddingBottom = tab === 'trade' ? 'calc(90px + env(safe-area-inset-bottom))' : '';
  const v = $('view');
  v.innerHTML = tab === 'league' ? leagueView() : tab === 'trade' ? tradeView() : tab === 'calls' ? callsView() : meView();
  v.querySelectorAll('[data-id]').forEach((el) => el.onclick = () => openProfile(el.dataset.id));
  const wb = v.querySelector('#wrapped'); if (wb) wb.onclick = () => playStory(wrappedSlides());
  const rt = v.querySelector('#replay-tour'); if (rt) rt.onclick = () => playTour();
  if (tab === 'trade') {
    v.querySelectorAll('.seg button').forEach((b) => b.onclick = () => { group = b.dataset.g; haptic(); render(); });
    const s = v.querySelector('.search'); s.value = query; s.oninput = () => { query = s.value; renderGrid(); };
    renderGrid();
  }
}

// ---------- player card ----------
function ringSvg(frac, done) {
  const r = 40, c = 2 * Math.PI * r;
  return `<svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="rgb(255 255 255 / .25)" stroke-width="10"/>
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="${done ? '#b9f5d3' : '#fff'}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${(c * Math.max(0.02, Math.min(1, frac))).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 48 48)"/></svg>`;
}
function playerCard() {
  const m = S.me, k = m.club, w = k.warmup;
  const rate = k.n ? k.wins / k.n : 0, counted = k.n >= k.rolling;
  const frac = counted ? rate / k.minRate : k.n / k.rolling;
  const tierTxt = m.tier ? TIER[m.tier] : (w.done ? 'Rookie' : '🌱 Warmup');
  const note = !w.started ? `🌱 Make your first call to start your ${k.warmupDays}-day warmup.`
    : !w.done ? `🌱 Warmup · day ${Math.min(w.days, k.warmupDays)} of ${k.warmupDays} · active ${Math.min(w.activeDays, k.warmupActiveDays)}/${k.warmupActiveDays} trading days
       <div class="p-bar"><i style="width:${Math.round(100 * Math.min(1, Math.min(w.days / k.warmupDays, w.activeDays / k.warmupActiveDays)))}%"></i></div>`
    : k.onTrack ? '✅ On track for today\'s 65% club payout.' : `Today ${k.calls}/${k.minCalls} calls${counted ? ` · need ${k.need} passes in your last ${k.rolling}` : ''}.`;
  return `<div class="player">
    <div class="p-row">${avatar({ name: m.name })}
      <div class="grow"><div class="p-name">${esc(m.name)}</div>
        <div class="chips"><span class="chip">${tierTxt}</span>${m.rank ? `<span class="chip">#${m.rank} of ${m.players}</span>` : ''}${k.streak ? `<span class="chip">🔥 ${k.streak}</span>` : ''}</div></div></div>
    <div class="p-stats">
      <div class="ring-wrap">${ringSvg(frac, counted && rate >= k.minRate)}<div class="c"><div><b class="num">${k.wins}/${k.n}</b><br><span>${counted ? pctR(rate) : 'last 20'}</span></div></div></div>
      <div class="p-kpis"><div class="kpi"><b class="num">${Math.round(k.points7d)}</b><span>pts week</span></div><div class="kpi"><b class="num">${Math.round(k.pointsAll)}</b><span>all-time</span></div><div class="kpi"><b class="num">${k.calls}</b><span>calls today</span></div></div>
    </div>
    <div class="p-note">${note}</div>
    ${S.calls.filter((c) => c.status !== 'open').length >= 3 ? '<button class="wrapped-btn" id="wrapped">▶ Your Wrapped</button>' : ''}
  </div>`;
}

// ---------- league ----------
function leagueView() {
  const L = S.club, top = [L[1], L[0], L[2]];
  const pod = (r, place) => r ? `<div class="pod ${place === 1 ? 'first' : ''} ${r.me ? 'me' : ''}" data-id="${r.id}">
      <div class="medal">${['🥇', '🥈', '🥉'][place - 1]}</div>${avatar(r)}
      <div class="nm">${esc(r.name)}</div><div class="pts num">${Math.round(r.points7d)} <small>pts</small></div>
      <div>${tierChip(r.tier, r.warmup)}${r.demo ? ' <span class="tier t-demo">DEMO</span>' : ''}</div></div>`
    : `<div class="pod empty ${place === 1 ? 'first' : ''}"><div class="medal">${['🥇', '🥈', '🥉'][place - 1]}</div><div class="avatar" style="margin:6px auto;background:var(--soft)">?</div><div class="nm">Open spot</div></div>`;
  const rest = L.slice(3, 20);
  const meRow = L.find((r) => r.me);
  const row = (r) => `<div class="lrow ${r.me ? 'me' : ''}" data-id="${r.id}"><div class="rank">${r.rank}</div>${avatar(r)}
      <div class="grow"><b>${esc(r.name)}${r.me ? ' · you' : ''}</b><span>${tierChip(r.tier, r.warmup)}${r.demo ? ' <span class="tier t-demo">DEMO</span>' : ''} · last 20 ${r.rolling}${r.streak ? ` · 🔥${r.streak}` : ''}</span></div>
      <div class="pts num">${Math.round(r.points7d)}<small>pts</small></div></div>`;
  return `${playerCard()}<main>
    <h2>🏆 This week's League</h2>
    <div class="podium">${pod(top[0], 2)}${pod(top[1], 1)}${pod(top[2], 3)}</div>
    ${rest.map(row).join('')}
    ${meRow && meRow.rank > 20 ? row(meRow) : ''}
    ${!L.length ? '<div class="card empty">No players yet. Make the first call and take the top spot.</div>' : ''}
    <p class="sub" style="text-align:center;margin:12px 0">Every trading day at midnight New York, players past warmup with 65%+ over their last 20 share 1,000 points.</p>
  </main>`;
}

// ---------- trade ----------
function tradeView() {
  return `<main>
    <h2>Make a call</h2>
    <div class="sub" style="margin:0 4px">${esc(S.market.session.line)}</div>
    <div class="seg"><button data-g="liquid" class="${group === 'liquid' ? 'on' : ''}">⚡ HT · LT</button><button data-g="long" class="${group === 'long' ? 'on' : ''}">🕰 D1 · D2</button></div>

function renderGrid() {
  const title = Object.fromEntries(S.market.boards.map((b) => [b.id, b.title]));
  const q = query.trim().toLowerCase();
  const rows = S.market.pairs.filter((p) => p.group === group && (!q || p.label.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)));
  $('grid').innerHTML = rows.map((p) => `<button class="stock" data-p="${p.symbol}">
      <div class="tk">${esc(p.label)}</div><div class="nm">${esc(p.name)}</div>
      <div class="px num">${px(p.price)}</div>
      <div class="bands">${p.boards.map((b) => `<span>${title[b.id]} ${b.listed && b.bps ? pct(b.bps) : '—'}</span>`).join('')}</div></button>`).join('')
    || '<div class="empty" style="grid-column:1/-1">No match</div>';
  $('grid').querySelectorAll('.stock').forEach((r) => r.onclick = () => openSheet(r.dataset.p));

// ---------- call sheet ----------
function openSheet(symbol) {
  haptic();
  const p = S.market.pairs.find((x) => x.symbol === symbol);
  const usable = p.boards.filter((b) => b.listed && b.bps && !b.weekendBlocked && !b.closed);
  pick = { p, board: usable[0]?.id ?? p.boards[0].id, direction: null };
  drawSheet();
  $('sheet').classList.add('on'); $('sheet-bg').classList.add('on');
  tg?.BackButton?.show();
}
function closeSheet() { $('sheet').classList.remove('on'); $('sheet-bg').classList.remove('on'); pick = null; tg?.BackButton?.hide(); }
$('sheet-bg').onclick = closeSheet;
tg?.BackButton?.onClick(closeSheet);

function confetti() {
  const colors = ['#2b8fdc', '#7cc8f7', '#13a05a', '#f5b301', '#5a5fe0'];
  return `<div class="confetti">${Array.from({ length: 28 }, (_, i) => {
    const a = (i / 28) * Math.PI * 2, d = 90 + Math.random() * 90;
    return `<i style="background:${colors[i % colors.length]};--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d - 40).toFixed(0)}px;--r:${(Math.random() * 540).toFixed(0)}deg;animation-delay:${(Math.random() * 0.12).toFixed(2)}s"></i>`;
  }).join('')}</div>`;
}

function drawSheet(result) {
  const { p } = pick;
  const meta = Object.fromEntries(S.market.boards.map((b) => [b.id, b]));
  if (result) {
    const ok = result.accepted, c = result.call;
    $('sheet').innerHTML = `<div class="grab"></div><div class="result">${ok ? confetti() : ''}
      <div style="font-size:52px">${ok ? '🔒' : '🚫'}</div>
      <div class="big" style="color:var(${ok ? '--pass' : '--fail'})">${ok ? 'ACCEPTED' : 'NOT ACCEPTED'}</div>
      ${ok ? `<div class="sub" style="font-size:15px">${esc(c.label)} ${c.direction.toUpperCase()} · ${c.boardTitle} · result by ${ny(c.expiresAt)} NY</div>
        <div class="kv"><div><span>Entry</span><span class="num" style="color:var(--ink);font-size:15px">${px(c.entry)}</span></div><div><span>PASS at</span><span class="num" style="color:var(--pass);font-size:15px">${px(c.target, c.entry)}</span></div><div><span>FAIL at</span><span class="num" style="color:var(--fail);font-size:15px">${px(c.stop, c.entry)}</span></div></div>
        <p class="sub">PASS or FAILED lands in your bot chat. Sealed <span class="muted">${c.hash.slice(0, 10)}…</span></p>`
      : `<p class="sub" style="font-size:15px;margin:10px 0 16px">${esc(result.reason)}</p>`}
      <button class="cta" id="done">${ok ? 'See my calls' : 'Try another'}</button></div>`;
    $('done').onclick = () => { closeSheet(); if (ok) go('calls'); load(); };
    return;
  }
  const b = p.boards.find((x) => x.id === pick.board);
  const d = b?.bps && p.price ? p.price * b.bps / 1e4 : null;
  const notes = p.boards.filter((x) => !x.listed || x.weekendBlocked || x.closed).map((x) => `${meta[x.id].title}: ${x.closed ? 'closed now (HT/LT 04:00–16:00 ET)' : x.weekendBlocked ? 'would run into the weekend' : 'not listed'}`);
  $('sheet').innerHTML = `<div class="grab"></div>
    <div class="s-head"><div class="avatar" style="font-size:13px">${esc(p.label)}</div><div class="grow"><b style="font-size:19px">${esc(p.name)}</b><span>Your tap locks the live price</span></div><div class="pts num" style="font-size:20px">${px(p.price)}<small>USDT</small></div></div>
    <div class="seg">${p.boards.map((x) => `<button data-b="${x.id}" class="${x.id === pick.board ? 'on' : ''}" ${!x.listed || x.weekendBlocked || x.closed ? 'disabled' : ''}>${meta[x.id].title} · ${meta[x.id].hours}h${x.bps ? `<br><small style="font-weight:700">${pct(x.bps)}</small>` : ''}</button>`).join('')}</div>
    <div class="pads">
      <button class="pad long ${pick.direction === 'long' ? 'on' : ''}" data-d="long"><b>⬆ LONG</b><span class="num">PASS at ${d ? px(p.price + d, p.price) : '–'}</span><span class="num">FAIL at ${d ? px(p.price - d, p.price) : '–'}</span></button>
      <button class="pad short ${pick.direction === 'short' ? 'on' : ''}" data-d="short"><b>⬇ SHORT</b><span class="num">PASS at ${d ? px(p.price - d, p.price) : '–'}</span><span class="num">FAIL at ${d ? px(p.price + d, p.price) : '–'}</span></button>
    </div>
    ${notes.length ? `<p class="sub">${notes.map(esc).join(' · ')}</p>` : ''}
    <p class="sub" style="text-align:center">${S.market.session.open ? `Result within ${meta[pick.board].hours} hours · no take-backs` : esc(S.market.session.line)}</p>
    <button class="cta" id="lock" ${pick.direction && S.market.session.open ? '' : 'disabled'}>${pick.direction ? `🔒 Lock it in · ${esc(p.label)} ${pick.direction.toUpperCase()}` : 'Pick LONG or SHORT'}</button>`;
  $('sheet').querySelectorAll('.seg button').forEach((x) => x.onclick = () => { if (x.disabled) return; pick.board = x.dataset.b; haptic(); drawSheet(); });
  $('sheet').querySelectorAll('.pad').forEach((x) => x.onclick = () => { pick.direction = x.dataset.d; haptic(); drawSheet(); });
  $('lock').onclick = lock;
}
async function lock() {
  const btn = $('lock'); btn.disabled = true; btn.textContent = 'Locking at the live price…';
  try {
    const r = await api('/api/app/call', { method: 'POST', body: JSON.stringify({ pair: pick.p.symbol, board: pick.board, direction: pick.direction }) });
    haptic(r.accepted ? 'ok' : 'err'); drawSheet(r);
  } catch (e) { haptic('err'); drawSheet({ accepted: false, reason: e.message }); }
}

// ---------- player profile ----------
async function openProfile(id) {
  haptic();
  pick = { profile: true };
  $('sheet').innerHTML = '<div class="grab"></div><div class="empty">Loading…</div>';
  $('sheet').classList.add('on'); $('sheet-bg').classList.add('on'); tg?.BackButton?.show();
  let p;
  try { p = await (await fetch(`/api/public/traders/${id}`)).json(); } catch { $('sheet').innerHTML = '<div class="grab"></div><div class="empty">Could not load this player.</div>'; return; }
  const res = (r) => r === 'NO RESULT' ? 'r-NO' : `r-${r}`;
  $('sheet').innerHTML = `<div class="grab"></div>
    <div class="s-head">${avatar(p)}<div class="grow"><b style="font-size:20px">${esc(p.name)}</b><span>${tierChip(p.tier, !p.warmup.done)}${p.demo ? ' <span class="tier t-demo">DEMO</span>' : ''} ${p.rank ? `· #${p.rank} this week` : ''} ${p.streak ? `· 🔥${p.streak}` : ''}</span></div>
      <div class="pts num" style="font-size:20px">${p.last20}<small>last 20</small></div></div>
    <div class="kv"><div><span>Pts week</span>${Math.round(p.points7d)}</div><div><span>All-time</span>${Math.round(p.pointsAll)}</div><div><span>Live (sealed)</span>${p.open.length}</div></div>
    <h2 style="margin:6px 4px 8px">Recent calls</h2>
    ${p.recent.map((c) => `<div class="match ${c.result === 'NO RESULT' ? '' : c.result}"><div class="avatar" style="background:var(--soft);color:var(--brand-2);font-size:12px">${esc(c.symbol)}</div>
      <div class="grow"><b>${c.direction === 'long' ? '⬆' : '⬇'} ${c.direction.toUpperCase()} · ${c.board}</b><span class="num">${px(c.entry)} → PASS ${px(c.target, c.entry)} · FAIL ${px(c.stop, c.entry)}</span></div>
      <span class="res ${res(c.result)}">${c.result}</span></div>`).join('') || '<div class="card empty">No resolved calls yet.</div>'}
    <div class="card" style="text-align:center;margin-top:6px">
      <div style="font-size:28px">🔓</div>
      <b style="font-size:16px">${p.moreAvailable ? `${p.resolvedTotal - p.recent.length} more calls in the full history` : 'Full call histories'}</b>
      <p class="sub">Showing the last ${p.recentLimit}. Approved API users can read every resolved call of every player.</p>
      <button class="cta" id="req-api">Request API access</button>
    </div>`;
  $('req-api').onclick = () => { haptic(); const u = 'https://t.me/BellWetherCallsbot?start=api'; tg?.openTelegramLink ? tg.openTelegramLink(u) : window.open(u); };
}

// ---------- calls ----------
function callsView() {
  const C = S.calls;
  const n = (r) => C.filter((c) => c.result === r).length;
  const resCls = (r) => r === 'NO RESULT' ? 'r-NO' : `r-${r}`;
  return `<main><h2>🎯 Your calls</h2>
    <div class="tally"><div><b style="color:var(--pass)">${n('PASS')}</b><span>PASS</span></div><div><b style="color:var(--fail)">${n('FAILED')}</b><span>FAILED</span></div><div><b style="color:var(--brand-2)">${n('PENDING')}</b><span>live</span></div></div>
    ${C.length ? C.map((c) => {
      const done = Math.min(1, (Date.now() - c.lockedAt) / (c.expiresAt - c.lockedAt));
      return `<div class="match ${c.result === 'NO RESULT' ? '' : c.result}">
        <div class="avatar" style="background:var(--soft);color:var(--brand-2);font-size:12px">${esc(c.label)}</div>
        <div class="grow"><b>${c.direction === 'long' ? '⬆' : '⬇'} ${c.direction.toUpperCase()} · ${c.boardTitle}</b>
          <span class="num">${px(c.entry)} → PASS ${px(c.target, c.entry)} · FAIL ${px(c.stop, c.entry)}</span>
          ${c.status === 'open' ? `<div class="bar" style="margin-top:6px;height:6px"><i style="width:${(done * 100).toFixed(0)}%"></i></div>` : ''}</div>
        <div style="text-align:right"><span class="res ${resCls(c.result)}">${c.result}</span><div class="sub" style="font-size:11px;margin-top:4px">${c.status === 'open' ? `in ${until(c.expiresAt)}` : new Date(c.resolvedAt).toLocaleDateString()}</div></div>
      </div>`;
    }).join('') : '<div class="card empty">No calls yet. Your first one starts the warmup clock.</div>'}
  </main>`;
}

// ---------- me ----------
function meView() {
  const B = S.me.boards;
  const hours = { HT: '2h', LT: '8h', D1: '24h', D2: '48h' };
  return `${playerCard()}<main><h2>Your tiers</h2>
    ${B.map((b) => `<div class="card"><div class="board"><div class="avatar">${b.title}</div>
        <div class="grow"><b>${b.tier ? tierChip(b.tier) : b.status === 'eliminated' ? '⛔ Eliminated' : b.qualified ? 'Qualified' : tierChip(null, false)} <span class="muted" style="font-size:12px">${hours[b.title]} board</span></b>
        <span>${b.wins} pass · ${b.losses} failed · ${b.washes} no result${b.open ? ` · ${b.open} live` : ''}</span></div>
        <div class="pts num">${pctR(b.hitRate)}<small>hit</small></div></div>
      ${!b.qualified ? `<div class="bar"><i style="width:${Math.min(100, Math.round((1 - b.need / 8) * 100))}%"></i></div><div class="sub" style="margin-top:6px">${b.need ? `${b.need} more results, then ` : ''}90% confidence you beat a coin flip (now ${pctR(b.lb)})</div>` : ''}
      ${b.copier ? '<div class="sub" style="color:var(--fail);margin-top:6px">⚠️ Flagged for copying one player: copied passes count as failed.</div>' : ''}
    </div>`).join('')}
    <div class="card sub">Tiers per board: ✅ BASE 55% · 🎯 SHARP 60% · 🐺 WOLF 70% (2× your share). Rename with /name in the bot.</div>
    <button class="cta" id="replay-tour" style="margin-bottom:12px;background:var(--card);color:var(--brand-2);border:1px solid var(--line);box-shadow:none">▶ Replay the tour</button></main>`;
}

if (q0.has('static')) document.head.insertAdjacentHTML('beforeend', '<style>.s-in > *, .tick-cloud span, .lanes i, .confetti i { animation: none !important; opacity: 1 !important; transform: none !important; } .lanes i { width: var(--w) !important; } .confetti { display: none; }</style>');   // preview: freeze animations
load().then(() => { if (q0.get('story') && S) { playStory(q0.get('story') === 'wrapped' ? wrappedSlides() : TOUR); if (q0.get('slide')) { showSlide(Number(q0.get('slide'))); story.paused = true; } } if (q0.get('profile') && S) openProfile(q0.get('profile')); const o = q0.get('open'); if (o && S) { openSheet(o); if (q0.get('board')) pick.board = q0.get('board'); const d = q0.get('dir'); if (d) { pick.direction = d; drawSheet(); if (q0.has('lock')) lock(); } } });
setInterval(() => { if (!pick) load(); }, 15000);
</script>
</body>
</html>
