<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellwether</title>
<meta name="description" content="Call US stocks on Bitget. Earn your tier. Lead the agent.">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Bellwether: black + light blue, liquid glass. Chart series validated on #0b121b. */
  :root {
    color-scheme: dark;
    --bg: #04070c; --bg-2: #0b121b;
    --glass: rgb(255 255 255 / .045); --glass-2: rgb(255 255 255 / .07); --glass-line: rgb(124 200 247 / .16); --glass-hi: rgb(255 255 255 / .10);
    --ink: #eaf4ff; --ink-2: #a3b7cb; --ink-3: #6c8399;
    --sky: #7cc8f7; --sky-2: #4aa8ee; --sky-3: #2b8fdc; --on-sky: #03121f;
    --pass: #3ddc97; --pass-bg: rgb(61 220 151 / .12); --fail: #ff6b6b; --fail-bg: rgb(255 107 107 / .12); --wash: #8fa3b8;
    --series-1: #3a97e0; --series-2: #d95926; --series-3: #9085e9;
    --gold: #ffd166;
    --r: 24px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 Sora, system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  .mono, code, pre { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  .num { font-variant-numeric: tabular-nums; }

  /* liquid background */
  .liquid { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(1200px 700px at 50% -10%, #0c2238 0%, var(--bg) 60%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; mix-blend-mode: screen; animation: drift 26s ease-in-out infinite alternate; }
  .b1 { width: 620px; height: 620px; left: -160px; top: -120px; background: radial-gradient(circle at 30% 30%, #4aa8ee, transparent 65%); }
  .b2 { width: 520px; height: 520px; right: -140px; top: 120px; background: radial-gradient(circle at 60% 40%, #7cc8f7, transparent 65%); animation-duration: 32s; opacity: .35; }
  .b3 { width: 700px; height: 700px; left: 30%; top: 70vh; background: radial-gradient(circle at 50% 50%, #1b5f9e, transparent 65%); animation-duration: 38s; opacity: .45; }
  @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(60px, 40px) scale(1.08); } 100% { transform: translate(-40px, 80px) scale(.95); } }
  .grain { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .05; background-image: radial-gradient(rgb(255 255 255 / .6) 1px, transparent 1px); background-size: 3px 3px; }

  /* glass */
  .glass { background: linear-gradient(180deg, var(--glass-2), var(--glass)); border: 1px solid var(--glass-line); border-radius: var(--r);
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 20px 50px rgb(0 0 0 / .35); }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 20px; }
  section { margin: 28px 0; }

  /* nav */
  .nav { position: sticky; top: 14px; z-index: 20; margin: 14px auto 0; max-width: 1140px; padding: 0 20px; }
  .nav .bar { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 14px; border-radius: 999px; }
  .nav .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; margin-right: auto; }
  .nav .logo img { width: 30px; height: 30px; filter: drop-shadow(0 0 12px rgb(74 168 238 / .6)); }
  .nav a.link { padding: 8px 12px; border-radius: 999px; color: var(--ink-2); font-size: 14px; font-weight: 600; }
  .nav a.link.on, .nav a.link:hover { color: var(--ink); background: var(--glass-2); }
  .nav .menu-btn { display: none; }
  @media (max-width: 760px) { .nav a.link { display: none; } .nav .bar.open a.link { display: block; } .nav .bar.open { flex-wrap: wrap; border-radius: 24px; }
    .nav .menu-btn { display: inline-flex; } }

  /* buttons */
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; font: 700 15px Sora, sans-serif; padding: 13px 22px; border-radius: 999px; transition: transform .15s, box-shadow .2s; white-space: nowrap; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: linear-gradient(135deg, #a5dcff 0%, var(--sky) 40%, var(--sky-2) 100%); color: var(--on-sky); box-shadow: 0 10px 30px rgb(74 168 238 / .35), inset 0 1px 0 rgb(255 255 255 / .6); }
  .btn.primary:hover { box-shadow: 0 14px 40px rgb(74 168 238 / .5), inset 0 1px 0 rgb(255 255 255 / .6); }
  .btn.ghost { background: var(--glass-2); color: var(--ink); border: 1px solid var(--glass-line); backdrop-filter: blur(12px); }
  .btn.ghost:hover { background: rgb(124 200 247 / .12); }
  .btn.sm { padding: 8px 14px; font-size: 13px; }

  /* hero */
  .hero { text-align: center; padding: 70px 0 30px; }
  .hero .mark { display: block; width: 92px; height: 92px; margin: 0 auto 22px; filter: drop-shadow(0 0 40px rgb(74 168 238 / .55)); animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--sky); padding: 6px 14px; border-radius: 999px; background: rgb(124 200 247 / .08); border: 1px solid var(--glass-line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); box-shadow: 0 0 10px var(--pass); }
  .dot.off { background: var(--fail); box-shadow: 0 0 10px var(--fail); }
  h1 { font-size: clamp(40px, 7vw, 78px); line-height: 1.02; letter-spacing: -0.035em; margin: 20px 0 16px; font-weight: 800; }
  h1 .sky { background: linear-gradient(90deg, #d7f0ff, var(--sky) 45%, var(--sky-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lede { font-size: clamp(16px, 2vw, 19px); color: var(--ink-2); max-width: 640px; margin: 0 auto 28px; }
  .cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin-top: 44px; padding: 6px; }
  .stats > div { padding: 16px; text-align: center; border-right: 1px solid var(--glass-line); }
  .stats > div:last-child { border-right: 0; }
  .stats b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .stats span { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } .stats > div { border-right: 0; border-bottom: 1px solid var(--glass-line); } .stats > div:last-child { grid-column: span 2; border-bottom: 0; } }

  h2 { font-size: clamp(24px, 3.4vw, 34px); letter-spacing: -0.02em; margin: 0 0 6px; font-weight: 800; }
  .sec-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .muted { color: var(--ink-3); } .sub { color: var(--ink-2); }

  /* leaderboard */
  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 14px; align-items: end; margin-bottom: 14px; }
  .pod { padding: 20px 12px 18px; text-align: center; cursor: pointer; transition: transform .2s; }
  .pod:hover { transform: translateY(-3px); }
  .pod.first { padding: 30px 12px 26px; background: linear-gradient(180deg, rgb(255 209 102 / .14), var(--glass) 70%); border-color: rgb(255 209 102 / .3); }
  .pod .medal { font-size: 30px; }
  .pod .nm { font-weight: 700; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pod .pts { font-size: 26px; font-weight: 800; color: var(--sky); letter-spacing: -0.02em; }
  .pod .pts small { font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .av { width: 48px; height: 48px; border-radius: 16px; display: inline-grid; place-items: center; font-weight: 800; font-size: 16px; background: rgb(124 200 247 / .12); color: var(--sky); border: 1px solid var(--glass-line); flex: none; }
  .pod .av { width: 58px; height: 58px; border-radius: 20px; font-size: 19px; margin-top: 10px; }
  .rows { padding: 6px; }
  .row { display: grid; grid-template-columns: 34px 44px 1fr auto auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; cursor: pointer; transition: background .15s; }
  .row:hover { background: var(--glass-2); }
  .row .rk { text-align: center; font-weight: 800; color: var(--ink-3); }
  .row .av { width: 40px; height: 40px; font-size: 13px; border-radius: 13px; }
  .row .nm { font-weight: 700; min-width: 0; } .row .nm div { font-size: 12px; color: var(--ink-3); font-weight: 400; margin-top: 2px; }
  .row .nm span.n { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .pt { text-align: right; font-weight: 800; font-size: 17px; } .row .pt small { display: block; font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .row .meta { color: var(--ink-2); font-size: 13px; text-align: right; }
  @media (max-width: 640px) { .row { grid-template-columns: 26px 40px 1fr auto; } .row .meta { display: none; } }
  .tier { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 999px; letter-spacing: .03em; vertical-align: 1px; }
  .t-WOLF { background: linear-gradient(90deg, #6b6ff0, var(--sky-2)); color: #fff; box-shadow: 0 0 14px rgb(107 111 240 / .4); }
  .t-SHARP { background: var(--sky-2); color: var(--on-sky); }
  .t-BASE { background: rgb(124 200 247 / .16); color: var(--sky); }
  .t-rookie { background: var(--glass-2); color: var(--ink-2); }
  .t-warmup { background: var(--pass-bg); color: var(--pass); }
  .t-agent { background: rgb(144 133 233 / .16); color: #c0b8ff; }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; flex-wrap: wrap; }
  .tabs button { border: 0; background: transparent; color: var(--ink-2); font: 600 13px Sora; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .tabs button.on { background: linear-gradient(135deg, var(--sky), var(--sky-2)); color: var(--on-sky); }
  .search { border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); border-radius: 999px; padding: 10px 16px; font: 14px Sora; min-width: 220px; outline: none; }
  .search:focus { border-color: var(--sky-2); }

  /* steps / features */
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 860px) { .three { grid-template-columns: 1fr; } }
  .feat { padding: 22px; }
  .feat .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: rgb(124 200 247 / .1); border: 1px solid var(--glass-line); margin-bottom: 14px; }
  .feat h3 { margin: 0 0 6px; font-size: 18px; }
  .feat p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .boards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  .boards div { padding: 14px; text-align: center; } .boards b { display: block; font-size: 22px; color: var(--sky); } .boards span { font-size: 12px; color: var(--ink-3); }
  @media (max-width: 640px) { .boards { grid-template-columns: repeat(2, 1fr); } }

  /* split panels */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
  .panel { padding: 26px; }
  pre { margin: 0; padding: 16px; border-radius: 16px; background: rgb(0 0 0 / .45); border: 1px solid var(--glass-line); overflow-x: auto; font-size: 12.5px; line-height: 1.6; color: #cfe6ff; }
  pre .k { color: var(--sky); } pre .s { color: #9be7c4; } pre .c { color: var(--ink-3); }
  code.inline { background: rgb(124 200 247 / .1); border: 1px solid var(--glass-line); padding: 1px 7px; border-radius: 8px; font-size: 13px; color: var(--sky); }

  /* profile */
  .prof { padding: 26px; display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; }
  @media (max-width: 760px) { .prof { grid-template-columns: 1fr; text-align: center; } .prof .ring { margin: 0 auto; } }
  .prof .av { width: 84px; height: 84px; border-radius: 26px; font-size: 28px; }
  .prof h1 { font-size: clamp(28px, 4vw, 42px); margin: 0 0 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; } @media (max-width: 760px) { .chips { justify-content: center; } }
  .chip { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--glass-line); }
  .ring { position: relative; width: 132px; height: 132px; }
  .ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
  .ring b { font-size: 28px; font-weight: 800; } .ring span { font-size: 11px; color: var(--ink-3); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0; }
  .kpis div { padding: 16px; } .kpis b { display: block; font-size: 24px; font-weight: 800; } .kpis span { font-size: 12px; color: var(--ink-3); }
  @media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .call { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--glass-line); background: var(--glass); margin-bottom: 8px; }
  .call .tk { font-weight: 800; font-size: 13px; text-align: center; padding: 8px 0; border-radius: 12px; background: rgb(124 200 247 / .1); color: var(--sky); }
  .call .d { font-size: 13px; color: var(--ink-2); }
  .res { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 10px; letter-spacing: .03em; }
  .r-PASS { background: var(--pass-bg); color: var(--pass); } .r-FAILED { background: var(--fail-bg); color: var(--fail); } .r-NO { background: var(--glass-2); color: var(--wash); } .r-LIVE { background: rgb(124 200 247 / .12); color: var(--sky); }
  .locked { position: relative; padding: 26px; text-align: center; overflow: hidden; }
  .locked .ghost-rows { filter: blur(6px); opacity: .35; pointer-events: none; }
  .locked .over { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; background: linear-gradient(180deg, transparent, rgb(4 7 12 / .7) 40%); }
  .locked h3 { margin: 6px 0; font-size: 20px; }

  /* tables (research / docs) */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--glass-line); white-space: nowrap; }
  th { color: var(--ink-3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  td.num, th.num { text-align: right; }
  .scroll { overflow-x: auto; }
  .pos { color: var(--pass); } .neg { color: var(--fail); }
  .badge-method { font: 700 11px "JetBrains Mono"; padding: 2px 7px; border-radius: 6px; } .GET { background: rgb(61 220 151 / .12); color: var(--pass); } .POST { background: rgb(124 200 247 / .14); color: var(--sky); }
  .chart-wrap { position: relative; }
  svg text { fill: var(--ink-2); font-size: 11px; font-family: Sora; }
  .tip { position: absolute; pointer-events: none; display: none; padding: 10px 12px; border-radius: 14px; font-size: 12px; min-width: 180px; z-index: 5; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 10px 0; } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .banner { padding: 12px 16px; border-radius: 16px; font-size: 13px; background: rgb(255 209 102 / .1); border: 1px solid rgb(255 209 102 / .3); color: #ffe3a3; margin-bottom: 14px; }

  footer { padding: 40px 0 60px; color: var(--ink-3); font-size: 13px; text-align: center; }
  .empty { text-align: center; color: var(--ink-3); padding: 30px; }
  @media (prefers-reduced-motion: reduce) { .blob, .hero .mark { animation: none; } }
</style>
</head>
<body>
<div class="liquid"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain"></div>

<div class="nav"><div class="bar glass" id="navbar">
  <a class="logo" href="#/"><img src="/assets/logo.svg" alt="">Bellwether</a>
  <a class="link" href="#/leaderboard" data-r="leaderboard">Leaderboard</a>
  <a class="link" href="#/agents" data-r="agents">Agents</a>
  <a class="link" href="#/api" data-r="api">API</a>
  <a class="link" href="#/research" data-r="research">Research</a>
  <button class="btn ghost sm menu-btn" id="menu" aria-label="Menu">☰</button>
  <a class="btn primary sm join" target="_blank" rel="noopener">Join</a>
</div></div>

<main class="wrap" id="app"></main>
<footer class="wrap">Bellwether · calls graded on live Bitget stock-perp prices · paper trading only, no deposits, not financial advice</footer>

<script>
const BOT = 'https://t.me/BellWetherCallsbot';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pctR = (x) => x == null || isNaN(x) ? '–' : `${Math.round(x * 100)}%`;
const px = (x, ref = x) => x == null ? '–' : Number(x).toFixed(Math.min(Math.max(0, 4 - Math.floor(Math.log10(Math.abs(ref || 1)))), 6));
const day = (t) => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };
const TIER = { WOLF: '🐺 WOLF', SHARP: '🎯 SHARP', BASE: '✅ BASE' };
const tierChip = (tier, warmup) => tier ? `<span class="tier t-${tier}">${TIER[tier]}</span>` : warmup ? '<span class="tier t-warmup">🌱 Warmup</span>' : '<span class="tier t-rookie">Rookie</span>';
const initials = (n) => n.replace(/^🤖\s*/, '').replace(/^@/, '').split(/[\s_.-]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';
const av = (r) => `<div class="av">${r.agent ? '🤖' : esc(initials(r.name))}</div>`;
const api = (p) => fetch(p).then((r) => r.ok ? r.json() : r.json().then((j) => Promise.reject(new Error(j.error || r.status))));
document.querySelectorAll('.join').forEach((a) => a.href = BOT);
$('#menu').onclick = () => $('#navbar').classList.toggle('open');

// ---------- router ----------
const routes = { '': home, leaderboard: leaderboardPage, trader: traderPage, agents: agentsPage, api: apiPage, research: researchPage };
async function route() {
  const [r, arg] = location.hash.replace(/^#\/?/, '').split('/');
  document.querySelectorAll('.nav a.link').forEach((a) => a.classList.toggle('on', a.dataset.r === r));
  $('#navbar').classList.remove('open');
  const app = $('#app');
  try { await (routes[r] ?? home)(app, arg); } catch (e) { app.innerHTML = `<section class="glass empty">Couldn't load: ${esc(e.message)}</section>`; }
  window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', route);

// ---------- shared pieces ----------
function podium(L) {
  const p = (r, place) => r ? `<a class="pod glass ${place === 1 ? 'first' : ''}" href="#/trader/${r.id}"><div class="medal">${['🥇', '🥈', '🥉'][place - 1]}</div>${av(r)}
      <div class="nm">${esc(r.name)}</div><div class="pts num">${Math.round(r.points7d)} <small>pts</small></div><div style="margin-top:6px">${tierChip(r.tier, r.warmup)}</div></a>`
    : `<div class="pod glass" style="opacity:.5"><div class="medal">${['🥇', '🥈', '🥉'][place - 1]}</div><div class="av" style="margin-top:10px">?</div><div class="nm">Open spot</div></div>`;
  return `<div class="podium">${p(L[1], 2)}${p(L[0], 1)}${p(L[2], 3)}</div>`;
}
const clubRow = (r) => `<a class="row" href="#/trader/${r.id}"><div class="rk">${r.rank}</div>${av(r)}
    <div class="nm"><span class="n">${esc(r.name)}</span><div>${tierChip(r.tier, r.warmup)}${r.agent ? ' <span class="tier t-agent">AGENT</span>' : ''} · last 20 ${r.rolling}${r.streak ? ` · 🔥${r.streak}` : ''}</div></div>
    <div class="meta">${Math.round(r.pointsAll)} all-time</div><div class="pt num">${Math.round(r.points7d)}<small>pts week</small></div></a>`;
const boardRow = (r) => `<a class="row" href="#/trader/${r.id}"><div class="rk">${r.rank}</div>${av(r)}
    <div class="nm"><span class="n">${esc(r.name)}</span><div>${r.tier ? tierChip(r.tier) : r.status === 'eliminated' ? '<span class="tier" style="background:var(--fail-bg);color:var(--fail)">OUT</span>' : tierChip(null, r.status === 'warmup')}${r.agent ? ' <span class="tier t-agent">AGENT</span>' : ''}</div></div>
    <div class="meta">${r.wins} pass · ${r.losses} failed · conf ${pctR(r.confidence)}</div><div class="pt num">${pctR(r.hitRate)}<small>hit rate</small></div></a>`;

// ---------- home ----------
async function home(app) {
  const o = await api('/api/public/overview');
  const s = o.stats;
  app.innerHTML = `
  <section class="hero">
    <img class="mark" src="/assets/logo.svg" alt="">
    <div class="eyebrow"><span class="dot ${o.session.open ? '' : 'off'}"></span>${esc(o.session.line.replace(/^\S+\s/, ''))}</div>
    <h1>Call US stocks.<br><span class="sky">Lead the agent.</span></h1>

function ring(frac, label, sub, good) {
  const r = 56, c = 2 * Math.PI * r;
  return `<div class="ring"><svg width="132" height="132" viewBox="0 0 132 132"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#a5dcff"/><stop offset="1" stop-color="${good ? '#3ddc97' : '#4aa8ee'}"/></linearGradient></defs>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="rgb(124 200 247 / .12)" stroke-width="12"/>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c * Math.max(.02, Math.min(1, frac))).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 66 66)" style="filter:drop-shadow(0 0 8px rgb(74 168 238 / .6))"/></svg>
    <div class="c"><div><b class="num">${label}</b><br><span>${sub}</span></div></div></div>`;
}

      ${s.pairs.map((p) => { const bs = s.bands.filter((b) => b.pair === p.symbol); return `<tr><td><b>${p.label}</b> <span class="muted">${esc(p.name)}</span></td><td class="num">${bs[0]?.price ? px(bs[0].price) : '–'}</td><td class="num">${bs.map((b) => `${title[b.board]} ±${(b.bps / 100).toFixed(2)}%`).join(' · ')}</td></tr>`; }).join('')}
    </tbody></table></div></div>
    <div class="glass panel"><h2 style="font-size:20px">House agent (Bitget demo)</h2><div class="scroll"><table><thead><tr><th>Board</th><th>Stock</th><th>Dir</th><th>Status</th><th class="num">R</th></tr></thead><tbody>
      ${s.trades.map((t) => `<tr><td>${title[t.board] ?? t.board}</td><td>${t.pair.replace(/USDT$/, '')}</td><td>${t.direction}</td><td>${esc(t.status)}</td><td class="num">${t.pnl_r == null ? '–' : `<span class="${t.pnl_r >= 0 ? 'pos' : 'neg'}">${t.pnl_r >= 0 ? '+' : ''}${t.pnl_r.toFixed(2)}R</span>`}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No agent trades yet</td></tr>'}
    </tbody></table></div>
    <h2 style="font-size:20px;margin-top:20px">Consensus signals</h2><div class="scroll"><table><thead><tr><th>Board</th><th>Stock</th><th>Dir</th><th class="num">Traders</th><th class="num">Weight</th></tr></thead><tbody>
      ${s.signals.map((x) => `<tr><td>${title[x.board] ?? x.board}</td><td>${x.pair.replace(/USDT$/, '')}</td><td>${x.direction}</td><td class="num">${x.n_traders}</td><td class="num">${pctR(x.agreement)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No signals yet</td></tr>'}
    </tbody></table></div></div>
  </section>`;
  app.querySelectorAll('[data-w]').forEach((b) => b.onclick = () => { rsWhich = b.dataset.w; researchPage(app); });
  if (bt?.byBoard) {
    drawBars(bt, s.boardMeta);
    $('#bt').innerHTML = `<thead><tr><th>Board</th><th>Strategy</th><th class="num">Trades</th><th class="num">Hit rate</th><th class="num">Avg R</th><th class="num">Total R</th></tr></thead><tbody>`
      + bt.byBoard.map((x) => `<tr><td>${title[x.board] ?? x.board}</td><td>${STRATS.find((t) => t.key === x.strategy)?.label ?? x.strategy}</td><td class="num">${x.trades}</td><td class="num">${pctR(x.hitRate)}</td><td class="num">${x.trades ? x.avgR.toFixed(3) : '–'}</td><td class="num">${x.trades ? x.totalR.toFixed(2) : '–'}</td></tr>`).join('') + '</tbody>';
  }
}
function drawBars(bt, meta) {
  const svg = $('#chart'), wrap = $('#cw'), tip = $('#tip');
  const W = wrap.clientWidth, H = 300, m = { l: 52, r: 12, t: 22, b: 36 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const rows = bt.byBoard, get = (b, s) => rows.find((r) => r.board === b && r.strategy === s);
  const vals = rows.filter((r) => r.trades).map((r) => r.avgR).concat([0]);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.14 || 0.1; lo -= pad; hi += pad;
  const y = (v) => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const gw = (W - m.l - m.r) / meta.length, bw = Math.min(38, (gw - 30) / 3 - 3);
  const step = (() => { const raw = (hi - lo) / 5, p = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 5, 10].map((k) => k * p).find((k) => k >= raw); })();
  let g = '';
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="rgb(124 200 247 / .08)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${+v.toFixed(2)}R</text>`;
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="rgb(124 200 247 / .35)"/>`;
  meta.forEach((b, i) => {
    const gx = m.l + i * gw + (gw - 3 * (bw + 3)) / 2;
    g += `<text x="${m.l + (i + .5) * gw}" y="${H - 14}" text-anchor="middle" style="font-weight:700;fill:var(--ink)">${b.title}</text><text x="${m.l + (i + .5) * gw}" y="${H - 1}" text-anchor="middle">${b.hours}h</text>`;
    STRATS.forEach((s, j) => {
      const r = get(b.id, s.key), x = gx + j * (bw + 3);
      if (!r || !r.trades) return void (g += `<text x="${x + bw / 2}" y="${y(0) - 5}" text-anchor="middle">–</text>`);
      const y0 = y(0), y1 = y(r.avgR), top = Math.min(y0, y1), h = Math.max(2, Math.abs(y1 - y0)), rad = Math.min(4, h / 2), up = r.avgR >= 0;
      const d = up ? `M${x},${y0}V${top + rad}Q${x},${top} ${x + rad},${top}H${x + bw - rad}Q${x + bw},${top} ${x + bw},${top + rad}V${y0}Z`
                   : `M${x},${y0}V${top + h - rad}Q${x},${top + h} ${x + rad},${top + h}H${x + bw - rad}Q${x + bw},${top + h} ${x + bw},${top + h - rad}V${y0}Z`;
      g += `<path d="${d}" fill="${s.color}" ${r.trades < 20 ? 'fill-opacity=".45"' : ''}/><text x="${x + bw / 2}" y="${up ? top - 5 : top + h + 13}" text-anchor="middle">n=${r.trades}</text>`
        + `<rect x="${x - 1}" y="${m.t}" width="${bw + 2}" height="${H - m.t - m.b}" fill="transparent" data-b="${b.id}" data-s="${s.key}"/>`;
    });
  });
  svg.innerHTML = g;
  svg.querySelectorAll('rect[data-b]').forEach((el) => {
    el.onmousemove = (ev) => {
      const r = get(el.dataset.b, el.dataset.s), s = STRATS.find((x) => x.key === el.dataset.s), bx = svg.getBoundingClientRect();
      tip.innerHTML = `<b>${s.label}</b><div class="muted">${meta.find((x) => x.id === el.dataset.b).title}</div><div>Avg ${r.avgR >= 0 ? '+' : ''}${r.avgR.toFixed(3)}R · ${r.trades} trades · hit ${pctR(r.hitRate)}</div>`;
      tip.style.display = 'block'; tip.style.left = Math.min(ev.clientX - bx.left + 14, W - 200) + 'px'; tip.style.top = Math.max(0, ev.clientY - bx.top - 50) + 'px';
    };
    el.onmouseleave = () => (tip.style.display = 'none');
  });
}

route();
setInterval(() => { const r = location.hash.replace(/^#\/?/, '').split('/')[0]; if (r === '' || r === 'leaderboard') route(); }, 30000);
</script>
