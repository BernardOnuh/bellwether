<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellwether</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2; --surface-1: #fcfcfb; --border: #e2e1dc;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #8a8984;
    --grid: #ecebe7;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --good: #0b7a3e; --bad: #c0362c; --warn-bg: #fff4d6; --warn-text: #6b4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2d2b;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e87;
      --grid: #262624;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --good: #4cc27f; --bad: #f07368; --warn-bg: #3a2f10; --warn-text: #f3d48a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2d2b;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e87;
    --grid: #262624;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --good: #4cc27f; --bad: #f07368; --warn-bg: #3a2f10; --warn-text: #f3d48a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .sub { color: var(--text-secondary); font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface-1); color: var(--text-secondary); padding: 6px 12px; font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); }
  .banner { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; font-size: 13px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .span-12 { grid-column: span 12; } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
  @media (max-width: 860px) { .span-7, .span-5, .span-6 { grid-column: span 12; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .tile .k { color: var(--text-secondary); font-size: 12px; }
  .tile .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--text-secondary); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .scroll { overflow-x: auto; }
  .pos { color: var(--good); } .neg { color: var(--bad); } .muted { color: var(--text-muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); }
  .chart-wrap { position: relative; }
  svg text { fill: var(--text-secondary); font-size: 11px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 4px 0 8px; font-size: 13px; color: var(--text-secondary); }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .12); display: none; min-width: 170px; }
  .tip .row { display: flex; justify-content: space-between; gap: 12px; }
  .tip i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  details summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Bellwether</h1>
      <div class="sub">Human calls → shrunk hit-rate ranking → consensus → risk-gated agent trades on Bitget demo</div>
    </div>
    <div class="seg" role="group" aria-label="Data source">
      <button data-db="live">Live</button><button data-db="sim">Simulated replay</button>
    </div>
  </header>
  <div id="banner"></div>

  <div class="grid">
    <section class="card span-12"><div class="tiles" id="tiles"></div></section>

    <section class="card span-12">
      <h2>Headline: does following the crowd's best beat following everyone?</h2>
      <div class="sub" id="bt-sub"></div>
      <div class="legend" id="legend"></div>
      <div class="chart-wrap" id="chart-wrap"><svg id="chart" width="100%" height="320" role="img" aria-label="Cumulative R after costs by strategy"></svg><div class="tip" id="tip"></div></div>
      <details><summary>Table view</summary><div class="scroll"><table id="bt-table"></table></div></details>
    </section>

    <section class="card span-7"><h2>Leaderboard</h2><div class="scroll"><table id="board"></table></div></section>
    <section class="card span-5"><h2>Pairs</h2><div class="scroll"><table id="pairs"></table></div></section>
    <section class="card span-7"><h2>Call feed</h2><div class="scroll"><table id="calls"></table></div></section>
    <section class="card span-5"><h2>Consensus signals</h2><div class="scroll"><table id="signals"></table></div></section>
    <section class="card span-12"><h2>Agent trades</h2><div class="scroll"><table id="trades"></table></div></section>
  </div>
</main>
<script>
const STRATS = [
  { key: 'consensus', label: 'Agent: top-ranked consensus', color: 'var(--series-1)' },
  { key: 'top5', label: 'Follow top-5 individually', color: 'var(--series-2)' },
  { key: 'everyone', label: 'Follow everyone', color: 'var(--series-3)' },
];
let which = (() => { try { return localStorage.getItem('db') || 'sim'; } catch { return 'sim'; } })();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (x) => x == null || isNaN(x) ? '–' : (x * 100).toFixed(1) + '%';
const sym = (s) => s.replace(/USDT$/, '');
const time = (t) => new Date(t).toISOString().slice(5, 16).replace('T', ' ');
const px = (x, ref = x) => { const d = Math.max(0, 4 - Math.floor(Math.log10(Math.abs(ref || 1)))); return Number(x).toFixed(Math.min(d, 8)); };
const signed = (x, d = 2) => x == null ? '–' : `<span class="${x >= 0 ? 'pos' : 'neg'}">${x >= 0 ? '+' : ''}${x.toFixed(d)}R</span>`;
const table = (el, head, rows) => {
  el.innerHTML = `<thead><tr>${head.map((h) => `<th class="${h.startsWith('#') ? 'num' : ''}">${h.replace(/^#/, '')}</th>`).join('')}</tr></thead>`
    + `<tbody>${rows.length ? rows.map((r) => `<tr>${r.map((c, i) => `<td class="${head[i].startsWith('#') ? 'num' : ''}">${c}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${head.length}" class="muted">Nothing yet</td></tr>`}</tbody>`;
};

document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
  which = b.dataset.db; try { localStorage.setItem('db', which); } catch {}
  load();
}));

function drawChart(bt) {
  const svg = $('chart'), wrap = $('chart-wrap'), tip = $('tip');
  const W = wrap.clientWidth, H = 320, m = { l: 48, r: 16, t: 12, b: 28 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const series = STRATS.map((s) => ({ ...s, pts: (bt.strategies.find((x) => x.strategy === s.key)?.curve ?? []) }));
  const t0 = bt.period.start, t1 = bt.period.end;
  const all = series.flatMap((s) => s.pts.map((p) => p.r)).concat([0]);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const x = (t) => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = (r) => m.t + (hi - r) / (hi - lo) * (H - m.t - m.b);
  const step = (() => { const raw = (hi - lo) / 5, p = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 5, 10].map((k) => k * p).find((k) => k >= raw); })();
  let g = '';
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step)
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" ${Math.abs(v) < 1e-9 ? 'stroke="var(--text-muted)"' : ''}/>`
      + `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${+v.toFixed(2)}R</text>`;
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--text-muted)" stroke-width="1"/>`;
  for (let d = Math.ceil(t0 / 864e5) * 864e5; d < t1; d += 864e5)
    g += `<text x="${x(d)}" y="${H - 8}" text-anchor="middle">${new Date(d).toISOString().slice(5, 10)}</text>`;
  for (const s of series) {
    if (!s.pts.length) continue;
    const d = [`M${x(t0)},${y(0)}`, ...s.pts.map((p) => `H${x(p.t)}V${y(p.r)}`), `H${x(t1)}`].join('');
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  g += `<line id="xh" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-muted)" stroke-dasharray="3 3" visibility="hidden"/>`;
  g += series.map((s, i) => `<circle id="dot${i}" r="4" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2" visibility="hidden"/>`).join('');
  g += `<rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" id="hit"/>`;
  svg.innerHTML = g;
  const at = (pts, t) => { let r = 0; for (const p of pts) { if (p.t > t) break; r = p.r; } return r; };
  const hit = svg.querySelector('#hit');
  hit.addEventListener('mousemove', (ev) => {
    const bx = svg.getBoundingClientRect(), mx = ev.clientX - bx.left;
    const t = t0 + (mx - m.l) / (W - m.l - m.r) * (t1 - t0);
    const xh = svg.querySelector('#xh'); xh.setAttribute('x1', mx); xh.setAttribute('x2', mx); xh.setAttribute('visibility', 'visible');
    const rows = series.map((s, i) => {
      const r = at(s.pts, t), n = s.pts.filter((p) => p.t <= t).length;
      const c = svg.querySelector('#dot' + i); c.setAttribute('cx', mx); c.setAttribute('cy', y(r)); c.setAttribute('visibility', 'visible');
      return `<div class="row"><span><i style="background:${s.color}"></i>${s.label}</span><b>${r >= 0 ? '+' : ''}${r.toFixed(2)}R</b></div><div class="row muted"><span></span><span>${n} trades</span></div>`;
    });
    tip.innerHTML = `<div class="muted">${new Date(t).toISOString().slice(0, 16).replace('T', ' ')} UTC</div>${rows.join('')}`;
    tip.style.display = 'block';
    tip.style.left = Math.min(mx + 14, W - tip.offsetWidth - 4) + 'px';
    tip.style.top = '16px';
  });
  hit.addEventListener('mouseleave', () => {
    tip.style.display = 'none';
    svg.querySelectorAll('#xh, circle').forEach((e) => e.setAttribute('visibility', 'hidden'));
  });
}

function render(s) {
  document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.db === which)));
  $('banner').innerHTML = s.simulated
    ? '<div class="banner">SIMULATED: fake traders with assigned skill, replayed on real Bitget 1-minute candles. Not real traders or real P&amp;L.</div>'
    : (s.kill ? '<div class="banner">Kill switch is ON: the agent will not open trades.</div>' : '');
  const c = s.counts || {};
  const decided = (c.wins || 0) + (c.losses || 0);
  const tr = s.trades.filter((t) => t.pnl_r != null);
  const totalR = tr.reduce((a, t) => a + t.pnl_r, 0);
  $('tiles').innerHTML = [
    ['Calls', c.calls || 0], ['Open', c.open || 0], ['Crowd hit rate', pct(decided ? c.wins / decided : null)],
    ['Wash rate', pct(c.calls - c.open ? c.washes / (c.calls - c.open) : null)], ['Signals', s.signals.length],
    ['Agent trades', s.trades.filter((t) => !['blocked', 'rejected', 'proposed'].includes(t.status)).length],
    ['Agent R (shown)', tr.length ? (totalR >= 0 ? '+' : '') + totalR.toFixed(2) : '–'],
  ].map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  const bt = s.backtest;
  if (bt) {
    $('bt-sub').textContent = `SIMULATED replay, ${new Date(bt.period.start).toISOString().slice(0, 10)} → ${new Date(bt.period.end).toISOString().slice(0, 10)}. `
      + 'Cumulative R after fees and spread; 1R = the bracket distance. Ambiguous candles count as full losses.';
    $('legend').innerHTML = STRATS.map((x) => `<span><i style="background:${x.color}"></i>${x.label}</span>`).join('');
    drawChart(bt);
    table($('bt-table'), ['Strategy', '#Trades', '#Wins', '#Losses', '#Washes', '#Hit rate', '#Total R', '#Avg R', '#Max DD'],
      bt.strategies.map((x) => [esc(STRATS.find((s) => s.key === x.strategy)?.label ?? x.strategy), x.trades, x.wins, x.losses, x.washes,
        pct(x.hitRate), signed(x.totalR), signed(x.avgR, 3), signed(x.maxDrawdownR)]));
  } else {
    $('bt-sub').textContent = 'Run `npm run simulate` to produce the replay.';
  }

  table($('board'), ['#', 'Trader', '#Score', '#W', '#L', '#Wash', '#Hit', '#Wash rate'],
    s.leaderboard.map((t, i) => [t.qualified ? i + 1 : '·', esc(t.name), (t.rankScore * 100).toFixed(1), t.wins, t.losses, t.washes, pct(t.hitRate), pct(t.washRate)]));
  table($('pairs'), ['Pair', 'Window', '#Price', '#Band', 'State'],
    s.profiles.map((p) => [sym(p.pair), p.volatile ? '30m' : '8h', px(p.price), `${px(p.band_lo, p.price)}–${px(p.band_hi, p.price)}`,
      p.closed ? '<span class="pill">closed</span>' : p.band_lo > p.band_hi ? '<span class="pill">too quiet</span>' : 'open']));
  const icon = { open: '⏳', win: '✅', loss: '❌', wash: '➖' };
  table($('calls'), ['Locked', 'Trader', 'Pair', 'Dir', '#Entry', '#±Dist', 'Result'],
    s.calls.map((c) => [time(c.locked_at), esc(c.name), sym(c.pair), c.direction, px(c.entry), px(c.distance, c.entry),
      `${icon[c.status]} ${c.status}${c.wash_reason ? ` (${c.wash_reason})` : ''}`]));
  table($('signals'), ['Time', 'Pair', 'Dir', '#Traders', '#Agree'],
    s.signals.map((x) => [time(x.created_at), sym(x.pair), x.direction, x.n_traders, pct(x.agreement)]));
  table($('trades'), ['Created', 'Pair', 'Dir', '#Entry', '#TP', '#SL', 'Status', '#R', 'Note'],
    s.trades.map((t) => [time(t.created_at), sym(t.pair), t.direction, px(t.entry), px(t.target, t.entry), px(t.stop, t.entry), t.status,
      t.pnl_r == null ? '–' : signed(t.pnl_r), esc(t.risk_note || t.reason || '')]));
}

async function load() {
  try { render(await (await fetch('/api/state?db=' + which)).json()); }
  catch (e) { $('banner').innerHTML = `<div class="banner">Could not load data: ${esc(e.message)}</div>`; }
}
load();
setInterval(load, 10000);
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(load, 200); });
</script>
</body>
</html>
